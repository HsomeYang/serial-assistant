name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package vsix
        run: npx vsce package --out serial-assistant.zip.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: serial-assistant-vsix
          path: "*.vsix"
