name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package vsix
        run: npx vsce package --out "serial-assistant-${{ github.ref_name }}.vsix"
      - name: Publish to VS Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "serial-assistant-${{ github.ref_name }}.vsix" --generate-notes
